[workspace]
resolver = "2"
members = [
    "crates/cg-cad-core",
    "crates/cg-cad-render",
    "server",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["aon-co-jp"]
license      = "MIT"
repository   = "https://github.com/aon-co-jp/open-cg-cad"

# RUSTSEC-2023-0071 (rsa Marvin Attack, 修正版なし) 回避: aon-co-jp/rsa-rs の互換実装へ差し替え。
[patch.crates-io]
rsa = { git = "https://github.com/aon-co-jp/rsa-rs", tag = "v0.1.0", version = "=0.10.0-rc.18" }
