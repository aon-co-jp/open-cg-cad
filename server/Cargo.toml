[package]
name = "open-cg-cad-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "open-cg-cadの最小HTTP API+簡易プレビュー画面。ユーザー指示(2026-08-25)『open-englishとopen-cg-cadがハイブリッドに相互作用』への対応として新設。cg-cad-coreのgenerate_buildingを呼び出し、敷地/法規制/建物種別/階数からドラフト建築物ボリュームを生成してJSON+簡易2Dプレビュー(SVG)で返す。"

[dependencies]
cg-cad-core = { path = "../crates/cg-cad-core" }
open-runo-poem-compat = { path = "../../RPoem/crates/open-runo-poem-compat" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
http-body-util = "0.1"
hyper = { version = "1.10", features = ["full"] }
bytes = "1.9"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
anyhow = "1"
# 2026-08-27: 半導体/CPU/NPU/GPU・自動車/バイク/新幹線/リニア/航空機の
# 旧図面をVPS・GitHubへ読み書きする機能のため。open-english/server/src/
# {vps_agent,github_agent}.rsの実機検証済みセキュリティ設計(許可パス
# オプトイン・任意シェルコマンド禁止・トークン非永続化)をそのまま移植。
# russh 0.63以降はrussh::keysモジュールへ鍵機能が統合されており、
# 別クレートrussh-keysは不要(open-english/CLAUDE.md 2026-08-25の
# アップグレード記録参照)。
russh = "0.63"

